openapi: 3.0.3
info:
  title: Nutrition Rebuild (AI Food Search) — consumed API surface
  version: 1.0.0
  description: >-
    Contract for the three EXISTING auth-scoped endpoints the rebuilt Nutrition
    page consumes. The backend is not modified by feature 019; these contracts
    pin the exact consumed surface so the frontend work is unambiguous.
    All endpoints require an authenticated session cookie (authenticate middleware).
servers:
  - url: /api
security:
  - cookieAuth: []
paths:
  /nutrition/analyze:
    post:
      operationId: analyzeFood
      summary: Live AI nutrition lookup for a natural-language food description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Natural-language food description, e.g. "banana".
                quantity:
                  type: number
                  minimum: 0.01
                  maximum: 1000
                unit:
                  type: string
                  maxLength: 20
            example:
              query: banana
      responses:
        '200':
          description: Live AI estimate for one standard serving.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/AnalyzeResult'
        '422':
          description: Input invalid or the text is not recognizable as food (AI_NOT_FOOD).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: AI temporarily unavailable (AI_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: AI not configured on server (AI_UNCONFIGURED) — page still works otherwise.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /nutrition:
    post:
      operationId: createNutritionEntry
      summary: Persist a logged food (the "+" action). Owner scoped from session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntry'
            example:
              foodName: Banana
              quantity: 118
              unit: g
              calories: 105
              protein: 1.3
              carbs: 27
              fat: 0.4
              mealType: lunch
              source: ai
      responses:
        '201':
          description: Entry created and returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Entry' }
        '422':
          description: Validation failure (required field, cap exceeded, bad mealType).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listNutritionEntries
      summary: List the authenticated user's entries, filterable by date (today) and mealType.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: YYYY-MM-DD. The rebuilt page always sends today.
        - name: mealType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MealType'
      responses:
        '200':
          description: Array of entries for the scope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Entry' }
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    MealType:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    AnalyzeResult:
      type: object
      required: [foodName, quantity, calories, protein, carbs, fat]
      properties:
        foodName: { type: string, maxLength: 100 }
        quantity: { type: number, minimum: 0.01, maximum: 1000 }
        unit: { type: string, maxLength: 20, description: typically "g" }
        calories: { type: number, minimum: 0, maximum: 2000 }
        protein: { type: number, minimum: 0, maximum: 500 }
        carbs: { type: number, minimum: 0, maximum: 500 }
        fat: { type: number, minimum: 0, maximum: 500 }
        fiber: { type: number, minimum: 0, maximum: 500, description: transient display-only, never persisted }
        sugar: { type: number, minimum: 0, maximum: 500, description: transient display-only, never persisted }
        sodium: { type: number, minimum: 0, maximum: 500, description: transient display-only, never persisted }
    CreateEntry:
      type: object
      required: [foodName, calories, mealType]
      properties:
        foodName: { type: string, minLength: 1, maxLength: 100 }
        quantity: { type: number, minimum: 0.01, maximum: 1000 }
        unit: { type: string, maxLength: 20 }
        calories: { type: number, minimum: 0, maximum: 2000 }
        protein: { type: number, minimum: 0, maximum: 500 }
        carbs: { type: number, minimum: 0, maximum: 500 }
        fat: { type: number, minimum: 0, maximum: 500 }
        mealType: { $ref: '#/components/schemas/MealType' }
        source: { type: string, enum: [ai, manual], default: manual, description: feature always sends "ai" }
        date: { type: string, format: date-time, description: omitted — server defaults to now (today) }
    Entry:
      type: object
      description: Persisted Food Log Entry (id, createdAt, updatedAt included by server).
      properties:
        id: { type: string }
        owner: { type: string, description: always the authenticated user — never disclosed to others }
        foodName: { type: string }
        quantity: { type: number }
        unit: { type: string }
        calories: { type: number }
        protein: { type: number }
        carbs: { type: number }
        fat: { type: number }
        mealType: { $ref: '#/components/schemas/MealType' }
        source: { type: string, enum: [ai, manual] }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            message: { type: string }
            code: { type: string, description: e.g. AI_UNCONFIGURED, AI_NOT_FOOD, AI_UNAVAILABLE, VALIDATION_ERROR }